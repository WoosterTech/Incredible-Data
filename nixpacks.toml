[phases.install]
cmds = [
    "/bin/bash -ol pipefail -c python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install poetry==$NIXPACKS_POETRY_VERSION && poetry sync --no-ansi",
]

[phases.release]
cmds = [
    "python manage.py migrate && python manage.py collectstatic --no-input && python manage.py compress",
]

[start]
cmd = "gunicorn config.wsgi --bind 0.0.0.0:8000"
