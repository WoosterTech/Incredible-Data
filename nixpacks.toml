[phases.install]
cmds = [
    "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install poetry==2.1.3 && poetry install --no-ansi",
]

[phases.release]
cmds = [
    "python manage.py migrate && python manage.py collectstatic --no-input && python manage.py compress",
]

[start]
cmd = "gunicorn config.wsgi --bind 0.0.0.0:8000"
