[project]
authors = [{ "name" = "Karl Wooster", "email" = "karl@woostertech.com" }]
name = "incredible-data"
dynamic = ["version"]
description = ""
readme = "README.md"


# ==== pytest ====
[tool.pytest.ini_options]
# DJANGO_SETTINGS_MODULE = "config.settings.test"
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db"
python_files = ["tests.py", "test_*.py"]
log_cli = true

# ==== Coverage ====
[tool.coverage.run]
include = ["incredible_data/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]

# ==== mypy ====
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/Riverside-Healthcare/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "poetry"
# version = "0.3.0"
# update_changelog_on_bump = true
major_version_zero = true
version_files = ["incredible_data/__init__.py:__version__"]

[tool.poetry]

version = "0.7.0b1"


[tool.poetry.dependencies]
python = ">=3.11,<4.0"
python-slugify = "^8.0.4"
pillow = "^10.3.0"
argon2-cffi = "^23.1.0"
whitenoise = "^6.6.0"
redis = "^5.0.3"
hiredis = "^2.3.2"
celery = { extras = ["redis"], version = "^5.3.6" }
django-celery-beat = "^2.6.0"
flower = "^2.0.1"
uvicorn = { extras = ["standard"], version = "^0.30.6" }
pydantic = "^2.8.2"
django = ">=5.2.2,<5.3"
django-environ = "^0.11.2"
django-model-utils = "^4.5.0"
django-extensions = "^3.2.3"
django-allauth = {version = "^65.9.0", extras = ["mfa"]}
django-crispy-forms = "^2.1"
crispy-bootstrap5 = "^2024.2"
django-phonenumber-field = { extras = ["phonenumberslite"], version = "^8.0.0" }
django-compressor = "^4.4"
django-redis = "^5.4.0"
djangorestframework = "^3.15.1"
django-cors-headers = "^4.3.1"
drf-spectacular = "^0.27.2"
django-constance = { extras = ["redis"], version = "^3.1.0" }
django-import-export = "^4.0.3"
django-money = "^3.4.1"
furl = "^2.1.3"
azure-ai-documentintelligence = "^1.0.0b2"
django-dbbackup = "^4.2.1"
shortuuid = "^1.0.13"
python-benedict = "^0.33.2"
django-funky-sheets = "^0.2.0"
django-qr-code = "^4.0.1"
django-tables2 = "^2.7.0"
django-rubble = { git = "https://github.com/WoosterTech/django-rubble.git", extras = [
  "neapolitan,cli,history",
] }
neapolitan = "^24.4"
loguru = "^0.7.2"
psycopg = { extras = ["binary"], version = "^3.2.1" }
django-debug-toolbar = "^4.4.6"
geopy = "^2.4.1"
rich = "^13.9.4"
gunicorn = "^23.0.0"
sentry-sdk = "^2.2.1"
django-anymail = { extras = ["sendgrid"], version = "^10.3" }
django-storages = { extras = ["s3"], version = "^1.14.3" }
pydantic-settings = "^2.7.1"
case-converter = "^1.2.0"
toml = "^0.10.2"
attrmagic = {git = "https://github.com/WoosterTech/AttrMagic.git"}

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
Werkzeug = { extras = ["watchdog"], version = "^3.0.2" }
ipdb = "^0.13.13"
watchfiles = "^0.21.0"
django-stubs = { extras = ["compatible-mypy"], version = "^4.2.7" }
djangorestframework-stubs = { extras = [
  "compatible-mypy",
], version = "^3.14.5" }
ruff = "^0.11.12"
djlint = "^1.34.1"
pre-commit = "^3.7.0"
commitizen = "^3.24.0"
django-upgrade = "^1.21.0"
deptry = "^0.21.1"
types-toml = "^0.10.8.20240310"
basedpyright = "^1.29.2"

[tool.poetry.group.test]
optional = true

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
extend_exclude = [".*/tests/", ".*/conftest.py", ".*/helpers/test_functions.py"]

[tool.deptry.per_rule_ignores]
DEP002 = [ # used in settings.INSTALLED_APPS (and others)
  "gunicorn",
  "django-compressor",
  "django-redis",
  "django-cors-headers",
  "hiredis",
  "django-storages",
  "django-anymail",
  "pillow",
  "argon2-cffi",
  "whitenoise",
  "redis",
  "psycopg",
  "django-cotton",
  "flower",
  "uvicorn",
  "crispy-bootstrap5",
  "django-constance",
  "django-celery-beat",
  "django-dbbackup",
  "django-qr-code",
]
DEP004 = ["bridge"]

[tool.deptry.package_module_name_map]
django-dbbackup = "dbbackup"
django-qr-code = "qr_code"
djangorestframework = "rest_framework"
django-environ = "environ"
django-debug-toolbar = "debug_toolbar"
case-converter = "caseconverter"
django-import-export = "import_export"
django-crispy-forms = "crispy_forms"
django-model-utils = "model_utils"
django-funky-sheets = "funky_sheets"
django-money = "djmoney"
azure-ai-documentintelligence = "azure"
python-benedict = "benedict"
python-slugify = "slugify"
django-phonenumber-field = "phonenumber_field"
django-allauth = "allauth"


[tool.poetry.group.test.dependencies]
pytest = "^8.3.2"
pytest-sugar = "^1.0.0"
coverage = "^7.4.4"
factory-boy = "^3.3.0"
django-coverage-plugin = "^3.1.0"
pytest-django = "^4.9.0"

[tool.poetry.group.bridge]
optional = true

[tool.poetry.group.bridge.dependencies]
python-bridge = { git = "https://github.com/WoosterInitiative/bridge.git" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
