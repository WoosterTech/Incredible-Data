{% extends "base.html" %}
{% block content %}
<h2>Metric Values Over Time</h2>
<canvas id="metricChart" width="800" height="400"></canvas>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const chartData = {{ chart_data| safe }};
    const labels = chartData.labels;
    const datasets = Object.entries(chartData.datasets).map(([metric, values]) => ({
        label: metric,
        data: values.map(v => v.value),
        fill: false,
        borderColor: '#' + Math.floor(Math.random() * 16777215).toString(16),
        backgroundColor: "#" + Math.floor(Math.random() * 16777215).toString(16),
        tension: 0.1
    }));
    new Chart(document.getElementById('metricChart'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: datasets
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'top' },
                title: { display: true, text: 'Metric Values Over Time' }
            }
        }
    });
</script>
{% endblock %}
