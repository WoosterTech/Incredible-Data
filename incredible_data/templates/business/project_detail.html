{% extends "base.html" %}

{% load neapolitan %}

{% block title %}
  {{ project|title }} Detail
{% endblock title %}
{% block content %}
  <h1>{{ project }}</h1>
  {% include "actions_partial.html" %}
  <div>
    <span class="bold-highlight">{{ project.name }}</span>
    {{ project.description }}
    {% object_detail project view.fields %}
  </div>
{% endblock content %}
